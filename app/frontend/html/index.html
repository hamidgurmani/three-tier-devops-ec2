<!DOCTYPE html>
<html>
<head>
  <title>3-Tier DevOps Project</title>
</head>
<body>
  <h1>Frontend – 3 Tier DevOps Project</h1>
  <p id="status">Checking backend...</p>

  <script>
    fetch("/api/health")
      .then(res => res.json())
      .then(data => {
        document.getElementById("status").innerText =
          "Backend status: " + data.status;
      })
      .catch(err => {
        document.getElementById("status").innerText =
          "Backend not reachable";
      });
  </script>
</body>
</html>
